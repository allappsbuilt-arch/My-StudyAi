# Supabase CLI configuration for MyStudyAI.
# Used by `supabase start` (local Docker stack), `supabase db push` and `supabase db reset`.
# Hosted projects are configured in the Supabase dashboard; these values only affect local development.

project_id = "mystudyai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
# Skip-login mode signs students in as guests
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false
